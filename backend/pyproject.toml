[project]
name = "orchestrator-backend"
version = "0.1.0"
description = "FastAPI backend for the Intelligent CI/CD Orchestrator"
# Pinned to 3.12 rather than the build machine's 3.13/3.14: the report's Appendix E states 3.12,
# and a version should not drift to whatever happens to be installed. See docs/decisions.md D-010.
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # print statements
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
    "ASYNC",     # async correctness
    "S",         # bandit
]
ignore = [
    "S101",  # assert: pytest needs it
    "B008",  # FastAPI's Depends() in a default is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests may hardcode credentials and use long literals.
"tests/**" = ["S105", "S106", "S107", "E501"]
"alembic/**" = ["E501"]
# This suite parses this repository's own reference exports and Jenkins' own responses, neither of
# which is untrusted input, and it reparses after each transformation on purpose.
"tests/test_integration_jenkins.py" = ["S105", "S106", "S107", "E501", "S314"]
# seed.py is a command-line entry point (`python -m app.db.seed`); its printed summary is its
# user interface, not a stray debug statement. The same events are also logged structurally.
"app/db/seed.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
# The quality bar is `mypy app`, so tests are not type-checked as strictly.
files = ["app"]
plugins = []

[[tool.mypy.overrides]]
module = ["asyncpg.*", "argon2.*", "jsonschema.*", "alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: calls a real external provider; needs GROQ_API_KEY. Opt in with -m live.",
    "integration: needs a running jenkins-dev or PostgreSQL. Opt in with -m integration.",
    "e2e: end to end through the whole stack. Opt in with -m e2e.",
]
filterwarnings = ["error::DeprecationWarning"]
