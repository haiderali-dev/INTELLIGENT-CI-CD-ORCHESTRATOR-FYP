# Alembic configuration.
#
# The database URL is deliberately NOT set here. alembic/env.py reads it from the application's
# Settings, so migrations and the running application can never disagree about which database they
# are talking to, and no credential is committed.

[alembic]
script_location = alembic
prepend_sys_path = .

# Timestamped, ordered filenames. The default is a bare revision hash, which sorts randomly in a
# directory listing and makes "what ran after what" unanswerable without opening every file.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No `timezone` setting: Alembic implements it with python-dateutil, and adding a dependency so
# that a comment in a generated file reads UTC rather than local time is poor value. The
# file_template above already timestamps and orders the filenames, which is what actually matters
# for reading a migration history.

# sqlalchemy.url is set by env.py from Settings.database_url.

[post_write_hooks]
# Autogenerated migrations are formatted by the same tools as the rest of the backend, so a
# generated file does not fail `ruff format --check`.
hooks = ruff_format,ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
