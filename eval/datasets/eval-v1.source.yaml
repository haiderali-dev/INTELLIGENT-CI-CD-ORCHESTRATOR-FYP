# The source of eval/datasets/eval-v1.jsonl: every item's message and gold label, written to be read.
#
# Rebuild the JSONL with `python -m eval build` (eval/curation.py). The builder adds the ids, the
# development and test splits, the 75-item ablation subset and the 20-item end-to-end sample, and it
# refuses a label that breaks the rules in eval/datasets/eval-v1.card.md, section 4.
#
# Who wrote this, and what that means (docs/decisions.md D-081). Claude Code wrote every message
# and every gold label here, at the project owner's instruction of 2026-10-24, because no person
# was available to write or label them and no public dataset covers this task. Part 4.9 asks for
# human labels; these are not. Every item therefore says `labeled_by: claude-code` and
# `needs_review: true`, and every report built from it says so beside its figures.
#
# Sources:
#   authored         written for this dataset
#   bp-4.6.5         BUILD_PROMPT.md 4.6.5's command table, verbatim
#   phase-4-draft    eval/datasets/sample.jsonl, the 30 items drafted in Phase 4, verbatim
#   clinc150         CLINC150 out-of-scope queries, verbatim (Larson et al., 2019; CC BY 3.0)
#   deepset-pi       deepset/prompt-injections, verbatim (deepset, 2023; Apache-2.0)
#   deepset-pi+      a deepset/prompt-injections payload appended to an authored request
#
# Gold intents list only the fields the message sets; an absent field is null, and an absent
# extra_stages is the empty list. Commits are quoted so YAML never reads one as a number.

version: 1
