<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CI/CD Orchestrator</title>
    <script>
      // Set the theme before the first paint, so a dark-mode viewer never sees a flash of light.
      // The same rule as src/app/theme/theme.ts: light unless the viewer chose otherwise.
      (function () {
        var preference = "light";
        try {
          var stored = localStorage.getItem("orchestrator.theme");
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch (error) {
          // Storage can be blocked; light is the default anyway.
        }
        var dark =
          preference === "dark" ||
          (preference === "system" &&
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
