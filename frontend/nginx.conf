# Serves the built app and proxies the API and live events to the backend, on one origin.

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # Sent on every response, including the proxied ones and errors. The page's own policy is a meta
    # tag (vite.config.ts); frame-ancestors only works as a header, so it is sent here.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;

    # Resolved per request through Docker's DNS, so nginx starts even while the backend is down or
    # being recreated, instead of refusing to start on an unknown host.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Generation and explanations can take a while on the model's free tier.
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The socket idles between events; the server's heartbeat keeps it well inside this.
        proxy_read_timeout 1h;
    }

    # Hashed file names never change content, so they can be kept for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Client-side routes: any path that is not a file is the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
