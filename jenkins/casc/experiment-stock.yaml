# Configuration as Code for the stock-Jenkins experiment arm (docs/decisions.md D-078).
#
# Part 4.8.2's sanity run: Jenkins with no Dynamic Queue Optimizer at all, to show that the
# observe-only arm, which has the plugin installed and ordering nothing, schedules as stock Jenkins
# does. jenkins-stock runs the controller image's `stock` stage, which is the other controllers'
# image without the plugin.
#
# This file is experiment-baseline.yaml without the `dynamicQueueOptimizer` block, and with this
# controller's own name for its agent, its URL and its system message. Nothing else may differ:
# verify.py compares the two. The block cannot stay in for the record: with the plugin absent,
# configuration as code finds no configurator for it and refuses to start Jenkins.

jenkins:
  systemMessage: >-
    Intelligent CI/CD Orchestrator - experiment arm: stock.
    Staging environments only; production deployment is refused by policy.

  # The controller runs zero builds. All work goes to the labelled Linux agents, which is what makes
  # the multi-executor behaviour the plugin was rewritten for observable at all.
  numExecutors: 0
  mode: EXCLUSIVE
  labelString: "controller"

  # No anonymous access, and the CLI over remoting is off: it is a second, less auditable way into
  # the controller that nothing in this project uses.
  remotingSecurity:
    enabled: true

  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
          name: "Administrator"
        - id: "orchestrator-bot"
          password: "${JENKINS_BOT_PASSWORD}"
          name: "Orchestrator Backend"

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        # The bot gets exactly the permissions BUILD_PROMPT 4.2.2 lists and nothing more. In
        # particular it has no Overall/Administer and no Run/Delete, so a compromised backend token
        # cannot reconfigure the controller or erase build history -- which is the evidence the
        # experiment depends on.
        - user:
            name: "orchestrator-bot"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Create"
              - "Job/Configure"
              - "Agent/Build"
              # 'Agent Read' in BUILD_PROMPT 4.2.2. The id is Agent/ExtendedRead: Jenkins renamed
              # the Computer permission group to Agent, and there is no plain Agent/Read --
              # 'Computer/Read' fails to parse and takes the whole controller down at boot.
              - "Agent/ExtendedRead"

  # No crumbIssuer block: Jenkins installs its default CSRF crumb issuer already, and this
  # version of DefaultCrumbIssuer exposes no excludeClientIPFromCrumb attribute, so configuring it
  # explicitly fails the whole boot. The backend fetches a crumb at runtime (BUILD_PROMPT 4.4.5).

  nodes:
    - permanent:
        name: "stock-agent"
        labelString: "linux"
        numExecutors: ${AGENT_EXECUTORS:-1}
        remoteFS: "/home/jenkins/agent"
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "stock-agent"
            port: 22
            credentialsId: "agent-ssh-key"
            # The agent images are built by this project and their host keys are generated on first
            # start, so there is no key to pin. On a multi-machine setup this must become
            # manuallyTrustedKeyVerificationStrategy or knownHostsFileKeyVerificationStrategy.
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}
            javaPath: "/opt/java/openjdk/bin/java"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              id: "agent-ssh-key"
              scope: SYSTEM
              username: "jenkins"
              description: "SSH key for the Linux build agents, generated by scripts/bootstrap.py"
              privateKeySource:
                directEntry:
                  privateKey: "${AGENT_SSH_PRIVATE_KEY}"

# No `security:` block. An earlier version set globalJobDslSecurityConfiguration, which this
# baseline rejects outright and which this project does not need: Job DSL is never used, jobs are
# created from rendered config.xml over REST. Script-console access is already prevented by the
# bot holding no Overall/Administer, and rule 1.5 is enforced in our own code by
# backend/tests/test_no_script_console.py and a verify.py check.

unclassified:
  location:
    url: "http://localhost:8088/"
    adminAddress: "${JENKINS_ADMIN_EMAIL:-admin@example.com}"

  # No `dynamicQueueOptimizer` block: this controller has no optimizer (see the header).
