# Configuration as Code for jenkins-dev, the development controller.
#
# BUILD_PROMPT 4.2.2 fixes what this file must configure: zero executors on the controller, a local
# security realm with admin and orchestrator-bot, matrix authorisation granting the bot only what it
# needs, both SSH agents on credential id agent-ssh-key, the dynamicQueueOptimizer block with the
# report's Appendix D defaults, CLI over remoting disabled, and no anonymous access.
#
# Secrets come from the environment, never from this file. docker-compose.yml passes them through
# from .env, which is gitignored.

jenkins:
  systemMessage: >-
    Intelligent CI/CD Orchestrator - development controller.
    Staging environments only; production deployment is refused by policy.

  # The controller runs zero builds. All work goes to the labelled Linux agents, which is what makes
  # the multi-executor behaviour the plugin was rewritten for observable at all.
  numExecutors: 0
  mode: EXCLUSIVE
  labelString: "controller"

  # No anonymous access, and the CLI over remoting is off: it is a second, less auditable way into
  # the controller that nothing in this project uses.
  remotingSecurity:
    enabled: true

  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
          name: "Administrator"
        - id: "orchestrator-bot"
          password: "${JENKINS_BOT_PASSWORD}"
          name: "Orchestrator Backend"

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        # The bot gets exactly the permissions BUILD_PROMPT 4.2.2 lists and nothing more. In
        # particular it has no Overall/Administer and no Run/Delete, so a compromised backend token
        # cannot reconfigure the controller or erase build history -- which is the evidence the
        # experiment depends on.
        - user:
            name: "orchestrator-bot"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Create"
              - "Job/Configure"
              - "Agent/Build"
              # 'Agent Read' in BUILD_PROMPT 4.2.2. The id is Agent/ExtendedRead: Jenkins renamed
              # the Computer permission group to Agent, and there is no plain Agent/Read --
              # 'Computer/Read' fails to parse and takes the whole controller down at boot.
              - "Agent/ExtendedRead"

  # No crumbIssuer block: Jenkins installs its default CSRF crumb issuer already, and this
  # version of DefaultCrumbIssuer exposes no excludeClientIPFromCrumb attribute, so configuring it
  # explicitly fails the whole boot. The backend fetches a crumb at runtime (BUILD_PROMPT 4.4.5).

  nodes:
    - permanent:
        name: "agent-1"
        labelString: "linux"
        numExecutors: 2
        remoteFS: "/home/jenkins/agent"
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "agent-1"
            port: 22
            credentialsId: "agent-ssh-key"
            # The agent images are built by this project and their host keys are generated on first
            # start, so there is no key to pin. On a multi-machine setup this must become
            # manuallyTrustedKeyVerificationStrategy or knownHostsFileKeyVerificationStrategy.
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}
            javaPath: "/opt/java/openjdk/bin/java"
    - permanent:
        name: "agent-2"
        labelString: "linux"
        numExecutors: 2
        remoteFS: "/home/jenkins/agent"
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "agent-2"
            port: 22
            credentialsId: "agent-ssh-key"
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}
            javaPath: "/opt/java/openjdk/bin/java"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              id: "agent-ssh-key"
              scope: SYSTEM
              username: "jenkins"
              description: "SSH key for the Linux build agents, generated by scripts/bootstrap.py"
              privateKeySource:
                directEntry:
                  privateKey: "${AGENT_SSH_PRIVATE_KEY}"

# No `security:` block. An earlier version set globalJobDslSecurityConfiguration, which this
# baseline rejects outright and which this project does not need: Job DSL is never used, jobs are
# created from rendered config.xml over REST. Script-console access is already prevented by the
# bot holding no Overall/Administer, and rule 1.5 is enforced in our own code by
# backend/tests/test_no_script_console.py and a verify.py check.

unclassified:
  location:
    url: "http://localhost:8087/"
    adminAddress: "${JENKINS_ADMIN_EMAIL:-admin@example.com}"

  # ---------------------------------------------------------------------------
  # The Dynamic Queue Optimizer.
  #
  # Only the non-floating-point fields are set here, deliberately.
  #
  # docs/decisions.md D-017 records a defect in configuration-as-code 2121+/2130: importing a YAML
  # file silently ignores this configuration's double-typed fields, while applying every int,
  # boolean, String and Secret. Setting weightUrgency here would look correct in the file, be
  # dropped on import, and leave the value at its code default -- a configuration that lies.
  #
  # That is harmless for this controller because the code defaults ARE the report's Appendix D
  # values: weightUrgency 0.5, weightDependency 0.3, weightExecutionTime 0.2,
  # agingBonusPerInterval 0.05, agingCap 0.15, similarityThreshold 0.35, recencyLambdaPerDay 0.1.
  # They are listed here as a comment so the intended configuration is visible and reviewable, and
  # ConfigAsCodeIT pins the defect so it fails loudly when JCasC is fixed.
  #
  # The aging-ablation arm of the Part 4.8.2 experiment matrix needs different float values and
  # therefore cannot be driven from JCasC until D-017 is resolved. That is tracked under Needs human
  # in PROGRESS.md.
  # ---------------------------------------------------------------------------
  dynamicQueueOptimizer:
    optimizerEnabled: true
    agingIntervalMinutes: 5
    estimatorK: 5
    historyWindow: 50
    rescoreIntervalSeconds: 60
    metricsEnabled: true
    metricsBackendUrl: "http://backend:8000/api/metrics"
    metricsToken: "${METRICS_TOKEN}"
