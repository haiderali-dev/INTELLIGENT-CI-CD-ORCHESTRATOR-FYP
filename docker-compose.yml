# Intelligent CI/CD Orchestrator - local stack.
#
# BUILD_PROMPT 4.2.3 fixes the shape: default services postgres, jenkins-dev (8087), agent-1,
# agent-2, backend (8000) and frontend (5173); an `experiment` profile adding jenkins-baseline
# (8085), jenkins-plugin (8086) and one agent each; named volumes for the Jenkins homes and the
# PostgreSQL data; healthchecks on PostgreSQL, Jenkins and the backend, with the backend waiting for
# PostgreSQL to be healthy. A `stock` profile adds jenkins-stock (8088), Jenkins without the
# optimizer, and its agent, for the experiment's stock-Jenkins arm (docs/decisions.md D-078).
#
# Usage:
#     docker compose up -d                      the default stack
#     docker compose --profile experiment up -d  the two experiment controllers
#     docker compose --profile stock up -d jenkins-stock stock-agent
#                                                the stock-Jenkins controller, named, since a
#                                                bare `up -d` recreates the default stack's too
#     docker compose --profile frontend up -d    adds the frontend once Phase 6 has built it
#
# Secrets come from .env, which is gitignored. Copy .env.example and fill it in first; the
# `${VAR:?message}` form below makes compose refuse to start with a named variable rather than
# silently defaulting a password.

name: orchestrator

# ---------------------------------------------------------------------------
# Shared fragments. The Jenkins controllers differ only in port, JCasC file and
# volume, and jenkins-stock in its image's stage, so the common parts are
# defined once.
# ---------------------------------------------------------------------------
x-jenkins-common: &jenkins-common
  build: &jenkins-build
    # Repository root: the controller image needs plugin/target/*.hpi as well as
    # jenkins/controller/. With no target, Compose builds the Dockerfile's last
    # stage, the controller with the optimizer; jenkins-stock alone asks for the
    # `stock` stage (D-078).
    context: .
    dockerfile: jenkins/controller/Dockerfile
    # No provenance attestation on any image here. They are local and never pushed, and the
    # attestation's timestamp gives every build a new image ID, even one served wholly from cache.
    # With it off, the same source builds the same ID, which is how the gate tells a stale container
    # from a current one (verify.py, "...run what the current source builds").
    provenance: false
  restart: unless-stopped
  environment: &jenkins-env
    JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in .env}
    JENKINS_BOT_PASSWORD: ${JENKINS_BOT_PASSWORD:?set JENKINS_BOT_PASSWORD in .env}
    METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in .env}
    # JCasC resolves a ${NAME} placeholder from a file called NAME in this directory before falling
    # back to the environment. The agent private key lives there rather than in .env because a PEM
    # key cannot survive a line-oriented env file: escaping its newlines produces a credential that
    # exists but fails every launch with "PEM problem: it is of unknown type".
    SECRETS: /run/secrets/casc
    JAVA_OPTS: >-
      -Djenkins.install.runSetupWizard=false
      -Djava.awt.headless=true
  healthcheck:
    # /login is served before authentication and before JCasC finishes, so it answers as soon as the
    # web tier is up. Probing an authenticated endpoint here would report unhealthy until the bot
    # user exists, which is a chicken-and-egg during first start.
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
    interval: 15s
    timeout: 10s
    # Generous: a first start installs plugins and applies JCasC before the port answers.
    start_period: 180s
    retries: 10

x-agent-common: &agent-common
  build:
    context: jenkins/agent
    dockerfile: Dockerfile
    provenance: false
  restart: unless-stopped
  environment: &agent-env
    # The controller authenticates with the private half of this pair; bootstrap.py writes both.
    JENKINS_AGENT_SSH_PUBKEY: ${AGENT_SSH_PUBLIC_KEY:?run scripts/bootstrap.py to generate the agent SSH key}
    # deploy.sh probes /health on this host. A deployed service's port is published on the Docker
    # host, not inside the agent, so localhost from here never answers (D-038).
    DEPLOY_HEALTH_HOST: host.docker.internal
  # Makes host.docker.internal resolve on a plain Linux Docker host too, not only Docker Desktop.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # The agents run docker build and deploy.sh, so they need the host daemon. This grants anything
    # on an agent effective root on the host; it is acceptable only because this is a single
    # developer machine running the project's own sample services, and BUILD_PROMPT 4.10 requires it
    # to be disclosed in the report's limitations section.
    - /var/run/docker.sock:/var/run/docker.sock

services:
  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d and -U named explicitly: without them pg_isready checks the wrong database and reports
      # healthy while the application's database is still being created.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestrator} -d ${POSTGRES_DB:-orchestrator}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    ports:
      # Exposed for local psql and for running Alembic from the host. Bound to loopback only.
      - "127.0.0.1:5432:5432"

  # -------------------------------------------------------------------------
  # Development controller and its two agents
  # -------------------------------------------------------------------------
  jenkins-dev:
    <<: *jenkins-common
    container_name: orchestrator-jenkins-dev
    environment:
      <<: *jenkins-env
      CASC_JENKINS_CONFIG: /var/jenkins_conf/jenkins.yaml
    volumes:
      - jenkins-dev-home:/var/jenkins_home
      # Mounted read-only: the controller reads its configuration and must never rewrite the file
      # the repository holds.
      - ./jenkins/casc/dev.yaml:/var/jenkins_conf/jenkins.yaml:ro
      - ./.secrets:/run/secrets/casc:ro
      - ./jenkins/reference-configs:/var/jenkins_conf/reference-configs
    ports:
      # Loopback only: the controller is for this machine, not the network it is on (security
      # review, finding 2). Agents connect over SSH, so no inbound agent port is published.
      - "127.0.0.1:8087:8080"
    depends_on:
      agent-1:
        condition: service_started
      agent-2:
        condition: service_started

  agent-1:
    <<: *agent-common
    container_name: orchestrator-agent-1
    volumes:
      - agent-1-work:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  agent-2:
    <<: *agent-common
    container_name: orchestrator-agent-2
    volumes:
      - agent-2-work:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  # -------------------------------------------------------------------------
  # Backend
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      provenance: false
    container_name: orchestrator-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestrator}
      JENKINS_URL: http://jenkins-dev:8080
      JENKINS_USER: ${JENKINS_USER:-orchestrator-bot}
      # Minted by scripts/bootstrap.py. Empty until then, which health reports as Jenkins down.
      JENKINS_TOKEN: ${JENKINS_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL_CHAIN: ${LLM_MODEL_CHAIN:-openai/gpt-oss-120b,openai/gpt-oss-20b}
      # fake by default so the stack starts and the demo runs with no API key and no quota spend.
      LLM_MODE: ${LLM_MODE:-fake}
      CATALOG_PATH: /app/catalog/services.yaml
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      HIGH_URGENCY_DAILY_QUOTA: ${HIGH_URGENCY_DAILY_QUOTA:-3}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
    volumes:
      # The catalog is the source of truth for service definitions and is read at runtime.
      # Admin registration appends schema-validated services to the source catalog.
      - ./catalog:/app/catalog:rw
      # The chatbot evaluation's report, for the Analytics page (T8.2). Read-only: the backend
      # serves it as `python -m eval report` wrote it.
      - ./eval/results:/app/eval/results:ro
      # The replay fixtures, so LLM_MODE=replay (the demo, docs/demo-script.md) always answers
      # from the repository's fixtures rather than the copy baked in at the last image build.
      - ./backend/app/ai/fixtures:/app/app/ai/fixtures:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Declared here as well as in backend/Dockerfile. The image's HEALTHCHECK covers a plain
      # `docker run`; this one is what `docker compose ps` and any future `depends_on:
      # service_healthy` read, and 4.2.3 requires the backend to have one.
      #
      # /api/health/live, not /api/health: liveness has no dependencies, so the container is not
      # marked unhealthy and restarted because Jenkins happens to be down.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        # 4.2.3: the backend waits for PostgreSQL to be healthy, not merely started, so the first
        # request cannot race the database's own initialisation.
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Frontend: the built app on nginx, which proxies /api and /ws to the backend so
  # the app talks to one origin (frontend/Dockerfile, frontend/nginx.conf). A
  # default service again now that the image exists (D-018, closed).
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      provenance: false
    container_name: orchestrator-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Experiment profile: two isolated controllers, one agent each.
  #
  # Separate Jenkins homes so neither arm can see the other's build history, which
  # the similarity estimator would otherwise read. AGENT_EXECUTORS drives the
  # 1-executor and 3-executor runs of the Part 4.8.2 matrix with no file edit.
  # -------------------------------------------------------------------------
  jenkins-baseline:
    <<: *jenkins-common
    profiles: ["experiment"]
    container_name: orchestrator-jenkins-baseline
    environment:
      <<: *jenkins-env
      CASC_JENKINS_CONFIG: /var/jenkins_conf/jenkins.yaml
      AGENT_EXECUTORS: ${AGENT_EXECUTORS:-1}
    volumes:
      - jenkins-baseline-home:/var/jenkins_home
      - ./jenkins/casc/experiment-baseline.yaml:/var/jenkins_conf/jenkins.yaml:ro
      - ./.secrets:/run/secrets/casc:ro
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      baseline-agent:
        condition: service_started

  baseline-agent:
    <<: *agent-common
    profiles: ["experiment"]
    container_name: orchestrator-baseline-agent
    volumes:
      - baseline-agent-work:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-plugin:
    <<: *jenkins-common
    profiles: ["experiment"]
    container_name: orchestrator-jenkins-plugin
    environment:
      <<: *jenkins-env
      CASC_JENKINS_CONFIG: /var/jenkins_conf/jenkins.yaml
      AGENT_EXECUTORS: ${AGENT_EXECUTORS:-1}
    volumes:
      - jenkins-plugin-home:/var/jenkins_home
      - ./jenkins/casc/experiment-plugin.yaml:/var/jenkins_conf/jenkins.yaml:ro
      - ./.secrets:/run/secrets/casc:ro
    ports:
      - "127.0.0.1:8086:8080"
    depends_on:
      plugin-agent:
        condition: service_started

  plugin-agent:
    <<: *agent-common
    profiles: ["experiment"]
    container_name: orchestrator-plugin-agent
    volumes:
      - plugin-agent-work:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  # -------------------------------------------------------------------------
  # Stock profile: Jenkins without the optimizer, and one agent (D-078).
  #
  # The stock-Jenkins arm of Part 4.8.2, its sanity run. The image is the
  # Dockerfile's `stock` stage, the one the other controllers' image is built on,
  # so the plugin is the only difference; the configuration is the baseline's
  # without the optimizer's block. A profile of its own, so the experiment
  # profile starts nothing more than it did.
  # -------------------------------------------------------------------------
  jenkins-stock:
    <<: *jenkins-common
    build:
      <<: *jenkins-build
      target: stock
    profiles: ["stock"]
    container_name: orchestrator-jenkins-stock
    environment:
      <<: *jenkins-env
      CASC_JENKINS_CONFIG: /var/jenkins_conf/jenkins.yaml
      AGENT_EXECUTORS: ${AGENT_EXECUTORS:-1}
    volumes:
      - jenkins-stock-home:/var/jenkins_home
      - ./jenkins/casc/experiment-stock.yaml:/var/jenkins_conf/jenkins.yaml:ro
      - ./.secrets:/run/secrets/casc:ro
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      stock-agent:
        condition: service_started

  stock-agent:
    <<: *agent-common
    profiles: ["stock"]
    container_name: orchestrator-stock-agent
    volumes:
      - stock-agent-work:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

# ---------------------------------------------------------------------------
# Named volumes. Never removed by tooling: `docker compose down -v` and
# `docker volume rm` are both forbidden by rule 1.5 because they destroy the
# warm build history the estimator and the demo depend on.
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
  jenkins-dev-home:
  jenkins-baseline-home:
  jenkins-plugin-home:
  jenkins-stock-home:
  agent-1-work:
  agent-2-work:
  baseline-agent-work:
  plugin-agent-work:
  stock-agent-work:
