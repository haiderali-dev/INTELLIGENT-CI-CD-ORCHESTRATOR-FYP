name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch cancels the first. Nothing here is a deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job below is skipped until its component has a build file. That keeps the
  # workflow green through the early phases without pretending the component passed:
  # a skipped job reports as skipped, not as success.
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.check.outputs.plugin }}
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Look for each component's build file
        run: |
          test -f plugin/pom.xml          && echo "plugin=true"   >> "$GITHUB_OUTPUT" || echo "plugin=false"   >> "$GITHUB_OUTPUT"
          test -f backend/pyproject.toml  && echo "backend=true"  >> "$GITHUB_OUTPUT" || echo "backend=false"  >> "$GITHUB_OUTPUT"
          test -f frontend/package.json   && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  verify:
    name: Phase checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_legacy_frozen diffs against the m2-final tag, so the full history
          # and its tags must be present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: verify.py --phase 0
        run: python scripts/verify.py --phase 0

  plugin:
    name: Plugin
    needs: detect
    if: needs.detect.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn -B verify
        run: mvn -B verify
        working-directory: plugin
      - name: Upload the .hpi
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-queue-optimizer-hpi
          path: plugin/target/*.hpi
          if-no-files-found: error

  backend:
    name: Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run mypy app
        working-directory: backend
      # The frontend's API types are generated from this schema (BUILD_PROMPT 4.7.1). An API
      # change that was not exported into frontend/openapi.json fails here.
      - name: frontend/openapi.json is the current schema
        run: |
          uv run python -m app.openapi_export ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json
        working-directory: backend
      # `live` needs a Groq key and `e2e` needs a running Jenkins. Neither belongs in CI.
      - run: uv run pytest -m "not live and not e2e"
        working-directory: backend

  frontend:
    name: Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Never hand-written (4.7.1): the types must be exactly what openapi.json generates.
      - name: src/api/schema.d.ts is generated from openapi.json
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # 4.7.6's browser flows (T6.8), against the backend in fake mode: backend/browser_backend.py runs
  # the real app with LLM_MODE=fake and in-memory stand-ins for Jenkins, its plugin and Git, so no
  # Jenkins, model or credential is needed. The runner's own Google Chrome runs them.
  flows:
    name: Browser flows
    needs: detect
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      # Phase 6's accessibility acceptance, 95 or more on both assistant pages (D-064), on every
      # push rather than only in the local gate: sixteen audits, signed in, in the runner's Chrome.
      - name: Lighthouse accessibility, both assistant pages
        run: npx playwright test --project=lighthouse
        working-directory: frontend
        env:
          LIGHTHOUSE: "1"
      # The accounts in these traces are made up for the run and die with it.
      - name: Keep the traces of a failed flow
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-flow-traces
          path: frontend/test-results/
          retention-days: 7
